name: Supabase Keep Alive

on:
  schedule:
    # 每天 UTC 02:17（北京 10:17）真实查询一次数据库
    # Supabase 免费版连续 7 天缺乏用户数据库查询会暂停项目
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. 拉取最新代码
        uses: actions/checkout@v4

      - name: 2. 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 3. 配置 Node.js 环境及缓存
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: 4. 干净安装依赖
        # 严格读取 pnpm-lock.yaml，确保云端与本地环境绝对一致
        run: pnpm install --frozen-lockfile

      - name: 5. Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: npx prisma generate
        working-directory: apps/web

      - name: 6. 查询 Supabase 保活
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: node scripts/supabase-keep-alive.mjs
        working-directory: apps/web
